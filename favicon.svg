<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glassmorphic Base Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Neon Cyberpunk / Glass Edge Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Signature Brand Gradient for Letters -->
    <linearGradient id="vkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Ambient Center Glow Behind Monogram -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow for VK Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#centerGlow)"/>

  <!-- Sleek Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Top Glass Sheen Arc -->
  <path d="M 88 25 Q 256 21 424 25" stroke="white" stroke-width="2.5" stroke-opacity="0.18" fill="none" stroke-linecap="round"/>

  <!-- Monogram Letters VK with Depth & Glow -->
  <path d="M179.74 357.46L125.59 357.46L51.21 154.54L111.63 154.54L166.63 318.42L139.84 318.42L195.70 154.54L255.27 154.54 M460.79 357.46L392.39 357.46L321.43 251.73L388.97 154.54L457.65 154.54L379.56 259.99L379.56 241.75L460.79 357.46M326.27 357.46L269.27 357.46L269.27 154.54L326.27 154.54" fill="url(#vkGrad)" filter="url(#shadowFilter)"/>
</svg>